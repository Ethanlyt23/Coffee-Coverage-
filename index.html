<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nedcoffee — Coverage Input</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#161b26;--bg3:#1e2535;--bg4:#252d3f;
  --txt:#e8eaf0;--txt2:#8892a4;--txt3:#4a5568;
  --green:#00d4aa;--gbg:rgba(0,212,170,0.08);
  --amber:#f5a623;--abg:rgba(245,166,35,0.08);
  --red:#ff5c5c;--rbg:rgba(255,92,92,0.08);
  --blue:#4a9eff;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);
  --rad:6px;--rad-lg:10px;
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--txt);font-size:13px;min-height:100vh}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:var(--txt);letter-spacing:-.02em}
.logo em{color:var(--green);font-style:normal}
.conn{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--txt2);font-family:'IBM Plex Mono',monospace}
.dot{width:6px;height:6px;border-radius:50%;background:var(--txt3);transition:all .3s}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.select-screen{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;padding:40px 20px}
.select-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rad-lg);padding:40px;width:100%;max-width:420px}
.select-card h1{font-size:22px;font-weight:600;margin-bottom:6px}
.select-card p{color:var(--txt2);font-size:13px;margin-bottom:28px;line-height:1.6}
.trader-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trader-btn{padding:12px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rad);color:var(--txt);font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;text-align:left;transition:all .15s}
.trader-btn:hover{background:var(--bg4);border-color:var(--green);color:var(--green)}
.app{display:none}
.subheader{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:56px;z-index:99}
.trader-info{display:flex;align-items:center;gap:10px}
.trader-badge{background:var(--gbg);border:1px solid var(--green);color:var(--green);font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;font-family:'IBM Plex Mono',monospace}
.change-btn{font-size:11px;color:var(--txt2);background:none;border:none;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;text-decoration:underline}
.change-btn:hover{color:var(--txt)}
.month-tabs{display:flex;gap:0;background:var(--bg3);border-radius:var(--rad);overflow:hidden;border:1px solid var(--border)}
.month-tab{padding:7px 12px;font-size:11px;font-weight:500;color:var(--txt2);cursor:pointer;border:none;background:none;font-family:'IBM Plex Sans',sans-serif;white-space:nowrap;transition:all .15s;position:relative}
.month-tab:hover{color:var(--txt);background:var(--bg4)}
.month-tab.active{background:var(--green);color:#0f1117;font-weight:600}
.month-tab.has-data::after{content:'';position:absolute;top:4px;right:3px;width:4px;height:4px;border-radius:50%;background:var(--green)}
.month-tab.active.has-data::after{background:#0f1117}
.save-status{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--txt2);min-width:150px;text-align:right}
.save-status.saving{color:var(--amber)}
.save-status.saved{color:var(--green)}
.save-status.error{color:var(--red)}
.page{padding:20px 24px;max-width:960px;margin:0 auto}
.month-heading{font-size:20px;font-weight:600;margin-bottom:4px}
.month-sub{font-size:12px;color:var(--txt2);margin-bottom:20px}
.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rad-lg);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:var(--bg3);padding:10px 14px;text-align:left;font-size:10px;font-weight:600;color:var(--txt2);border-bottom:1px solid var(--border2);letter-spacing:.06em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace}
th.tc{text-align:center}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
.rname{font-size:13px;font-weight:500;color:var(--txt)}
.rcountry{font-size:10px;color:var(--txt3);font-family:'IBM Plex Mono',monospace;margin-top:1px}
.annual{font-size:11px;font-weight:600;color:var(--txt2);font-family:'IBM Plex Mono',monospace}
.blend-pill{display:inline-flex;font-size:9px;border-radius:4px;overflow:hidden;border:1px solid var(--border2);font-family:'IBM Plex Mono',monospace;font-weight:600}
.ba{background:rgba(0,212,170,.15);color:var(--green);padding:2px 5px}
.br{background:rgba(245,166,35,.12);color:var(--amber);padding:2px 5px}
.b100a{background:rgba(0,212,170,.15);color:var(--green);padding:2px 8px;border-radius:4px;border:1px solid var(--border2);font-size:9px;font-family:'IBM Plex Mono',monospace;font-weight:600;display:inline-block}
.b100r{background:rgba(245,166,35,.12);color:var(--amber);padding:2px 8px;border-radius:4px;border:1px solid var(--border2);font-size:9px;font-family:'IBM Plex Mono',monospace;font-weight:600;display:inline-block}
.cov-wrap{display:flex;align-items:center;gap:8px;justify-content:center}
.cov-inp{width:66px;font-size:18px;font-weight:600;text-align:center;padding:8px 4px;border-radius:var(--rad);border:1px solid var(--border2);background:var(--bg3);color:var(--txt);font-family:'IBM Plex Mono',monospace;-moz-appearance:textfield;transition:border-color .15s,background .15s}
.cov-inp::-webkit-inner-spin-button,.cov-inp::-webkit-outer-spin-button{-webkit-appearance:none}
.cov-inp:focus{outline:none;border-color:var(--blue);background:var(--bg4)}
.cov-inp.g{border-color:var(--green);background:rgba(0,212,170,.06);color:var(--green)}
.cov-inp.a{border-color:var(--amber);background:rgba(245,166,35,.06);color:var(--amber)}
.cov-inp.r{border-color:var(--red);background:rgba(255,92,92,.06);color:var(--red)}
.bar-wrap{height:3px;background:var(--bg4);border-radius:2px;width:80px}
.bar-fill{height:100%;border-radius:2px;transition:width .3s,background .3s}
.tick{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;opacity:0;transition:opacity .2s}
.tick.show{opacity:1}
.tick.ok{background:var(--gbg);color:var(--green)}
.tick.err{background:var(--rbg);color:var(--red)}
.summary{display:flex;gap:20px;padding:12px 16px;background:var(--bg3);border-top:1px solid var(--border);flex-wrap:wrap}
.sitem{font-size:11px;color:var(--txt2)}.sitem strong{color:var(--txt);font-weight:600}
</style>
</head>
<body>
<header class="header">
  <div class="logo">Ned<em>coffee</em> — Coverage</div>
  <div class="conn"><div class="dot" id="dot"></div><span id="connLabel">Connecting...</span></div>
</header>

<div class="select-screen" id="selectScreen">
  <div class="select-card">
    <h1>Coverage Input</h1>
    <p>Select your name to enter or update your roaster coverage figures for 2026.</p>
    <div class="trader-grid" id="traderGrid"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="subheader">
    <div class="trader-info">
      <div class="trader-badge" id="traderBadge"></div>
      <button class="change-btn" id="changeBtn">change trader</button>
    </div>
    <div style="display:flex;gap:4px;flex-wrap:wrap" id="monthTabs"></div>
    <div class="save-status" id="saveStatus">—</div>
  </div>
  <div class="page">
    <div class="month-heading" id="monthHeading"></div>
    <div class="month-sub" id="monthSub"></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Roaster</th>
          <th>Ctry</th>
          <th>Annual bags</th>
          <th>Blend</th>
          <th class="tc" style="width:160px">Months covered (0–12)</th>
          <th style="width:100px">Coverage</th>
        </tr></thead>
        <tbody id="tBody"></tbody>
      </table>
    </div>
    <div class="summary" id="summary"></div>
  </div>
</div>

<script>
var firebaseConfig={apiKey:"AIzaSyAWaU8iQkR6Q6avugQamC-1IIZLsSpYV7A",authDomain:"sucden-coffee-coverage.firebaseapp.com",databaseURL:"https://sucden-coffee-coverage-default-rtdb.europe-west1.firebasedatabase.app",projectId:"sucden-coffee-coverage",storageBucket:"sucden-coffee-coverage.firebasestorage.app",messagingSenderId:"237675379815",appId:"1:237675379815:web:445e380ce6b9f0ad55a8c2"};
var TRADERS=['Alberto','Andre','Chris','CoffeeAM','Daniel','Dennis','Harish','Lucas','Michel','Richard','Wayne'];
var MONTHS=['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10','2026-11','2026-12'];
var MLABELS=['Jan 2026','Feb 2026','Mar 2026','Apr 2026','May 2026','Jun 2026','Jul 2026','Aug 2026','Sep 2026','Oct 2026','Nov 2026','Dec 2026'];
var MSHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var db,ST={roasters:[],data:{}};
var currentTrader=null,currentMonth='2026-06',saveTimer=null,pendingSaves=0;

firebase.initializeApp(firebaseConfig);
db=firebase.database();

db.ref('.info/connected').on('value',function(s){
  var on=!!s.val();
  document.getElementById('dot').className='dot'+(on?' on':'');
  document.getElementById('connLabel').textContent=on?'Live':'Offline';
});

db.ref('coverage').on('value',function(snap){
  var r=snap.val()||{};
  if(r.roasters){var raw=r.roasters;ST.roasters=Array.isArray(raw)?raw:Object.values(raw).filter(function(x){return x&&x.id;});}
  ST.data={};
  if(r.data){Object.keys(r.data).forEach(function(k){if(r.data[k]!==null&&r.data[k]!==undefined)ST.data[k]=r.data[k];});}
  if(currentTrader){renderTable();buildMonthTabs();}
});

TRADERS.forEach(function(t){
  var btn=document.createElement('button');
  btn.className='trader-btn';btn.textContent=t;
  btn.addEventListener('click',function(){selectTrader(t);});
  document.getElementById('traderGrid').appendChild(btn);
});

function selectTrader(t){
  currentTrader=t;
  document.getElementById('selectScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('traderBadge').textContent=t;
  buildMonthTabs();renderTable();
}

document.getElementById('changeBtn').addEventListener('click',function(){
  currentTrader=null;
  document.getElementById('selectScreen').style.display='flex';
  document.getElementById('app').style.display='none';
});

function buildMonthTabs(){
  var container=document.getElementById('monthTabs');container.innerHTML='';
  MONTHS.forEach(function(m,i){
    var myRoasters=ST.roasters.filter(function(r){return r.trader===currentTrader;});
    var hasData=myRoasters.some(function(r){return ST.data[r.id+'__'+m]!==undefined;});
    var btn=document.createElement('button');
    btn.className='month-tab'+(m===currentMonth?' active':'')+(hasData?' has-data':'');
    btn.textContent=MSHORT[i];btn.dataset.month=m;
    btn.addEventListener('click',function(){currentMonth=this.dataset.month;buildMonthTabs();renderTable();});
    container.appendChild(btn);
  });
}

function getCov(rid,month){var v=ST.data[rid+'__'+month];return(v!==undefined&&v!==null)?parseFloat(v):null;}
function barColor(v){if(v===null)return'var(--bg4)';if(v>=6)return'var(--green)';if(v>=4)return'var(--amber)';return'var(--red)';}
function inpClass(v){if(v===null||v===undefined)return'';if(v>=6)return'g';if(v>=4)return'a';return'r';}
function fmtK(n){if(!n||n===0)return'—';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1000)return Math.round(n/1000)+'k';return String(n);}

function renderTable(){
  var idx=MONTHS.indexOf(currentMonth);
  document.getElementById('monthHeading').textContent=MLABELS[idx]+' Coverage';
  var myRoasters=ST.roasters.filter(function(r){return r.trader===currentTrader;});
  var filled=myRoasters.filter(function(r){return getCov(r.id,currentMonth)!==null;}).length;
  document.getElementById('monthSub').textContent=filled+' of '+myRoasters.length+' roasters filled in for this month';
  var tbody=document.getElementById('tBody');tbody.innerHTML='';
  myRoasters.forEach(function(r){
    var v=getCov(r.id,currentMonth);
    var pct=v!==null?v/12*100:0;
    var arabica=r.arabica||0;
    var tp=arabica===100?'ara':arabica===0?'rob':'mix';
    var tr=document.createElement('tr');
    var nameTd=document.createElement('td');nameTd.innerHTML='<div class="rname">'+r.name+'</div><div class="rcountry">'+r.country+'</div>';tr.appendChild(nameTd);
    var ctryTd=document.createElement('td');ctryTd.innerHTML='<span class="rcountry" style="font-size:12px">'+r.country+'</span>';tr.appendChild(ctryTd);
    var annualTd=document.createElement('td');annualTd.innerHTML='<span class="annual">'+fmtK(r.annual||0)+'</span>';tr.appendChild(annualTd);
    var blendTd=document.createElement('td');
    if(tp==='ara')blendTd.innerHTML='<span class="b100a">100% Ara</span>';
    else if(tp==='rob')blendTd.innerHTML='<span class="b100r">100% Rob</span>';
    else blendTd.innerHTML='<span class="blend-pill"><span class="ba">'+arabica+'%A</span><span class="br">'+(100-arabica)+'%R</span></span>';
    tr.appendChild(blendTd);
    var inpTd=document.createElement('td');inpTd.style.textAlign='center';
    var wrap=document.createElement('div');wrap.className='cov-wrap';
    var inp=document.createElement('input');
    inp.type='number';inp.min=0;inp.max=12;inp.step=0.5;
    inp.className='cov-inp'+(inpClass(v)?' '+inpClass(v):'');
    inp.dataset.rid=r.id;
    if(v!==null)inp.value=v;
    inp.placeholder='0–12';
    var tick=document.createElement('div');tick.className='tick';tick.id='tick-'+r.id;
    inp.addEventListener('change',function(){saveCov(this.dataset.rid,this.value,this);});
    wrap.appendChild(inp);wrap.appendChild(tick);inpTd.appendChild(wrap);tr.appendChild(inpTd);
    var barTd=document.createElement('td');
    var barWrap=document.createElement('div');barWrap.className='bar-wrap';
    var barFill=document.createElement('div');barFill.className='bar-fill';
    barFill.id='bar-'+r.id;barFill.style.width=pct+'%';barFill.style.background=barColor(v);
    barWrap.appendChild(barFill);barTd.appendChild(barWrap);tr.appendChild(barTd);
    tbody.appendChild(tr);
  });
  renderSummary(myRoasters);
}

function saveCov(rid,val,inp){
  var n=parseFloat(val);
  var v=(isNaN(n)||val===''||val===null)?null:Math.min(12,Math.max(0,Math.round(n*2)/2));
  var key=rid+'__'+currentMonth;
  if(v===null)delete ST.data[key];else ST.data[key]=v;
  if(inp){inp.className='cov-inp'+(inpClass(v)?' '+inpClass(v):'');if(v!==null)inp.value=v;}
  var bar=document.getElementById('bar-'+rid);
  if(bar){bar.style.width=(v?v/12*100:0)+'%';bar.style.background=barColor(v);}
  setStatus('saving');pendingSaves++;
  var updates={};updates['coverage/data/'+key]=v;
  db.ref().update(updates).then(function(){
    pendingSaves--;showTick(rid,true);buildMonthTabs();
    var myRoasters=ST.roasters.filter(function(r){return r.trader===currentTrader;});
    renderSummary(myRoasters);
    var filled=myRoasters.filter(function(r){return getCov(r.id,currentMonth)!==null;}).length;
    document.getElementById('monthSub').textContent=filled+' of '+myRoasters.length+' roasters filled in for this month';
    if(pendingSaves<=0){pendingSaves=0;setStatus('saved');}
  }).catch(function(){pendingSaves--;showTick(rid,false);setStatus('error');});
}

function showTick(rid,ok){
  var tick=document.getElementById('tick-'+rid);if(!tick)return;
  tick.className='tick show '+(ok?'ok':'err');tick.textContent=ok?'✓':'✗';
  setTimeout(function(){tick.className='tick';},2000);
}

function setStatus(s){
  var el=document.getElementById('saveStatus');clearTimeout(saveTimer);
  if(s==='saving'){el.className='save-status saving';el.textContent='Saving...';}
  else if(s==='saved'){el.className='save-status saved';el.textContent='All changes saved ✓';saveTimer=setTimeout(function(){el.className='save-status';el.textContent='—';},3000);}
  else{el.className='save-status error';el.textContent='Save failed — check connection';}
}

function renderSummary(myRoasters){
  var filled=myRoasters.filter(function(r){return getCov(r.id,currentMonth)!==null;}).length;
  var vals=myRoasters.map(function(r){return getCov(r.id,currentMonth);}).filter(function(v){return v!==null;});
  var avg=vals.length?(vals.reduce(function(a,b){return a+b;},0)/vals.length).toFixed(1):'—';
  document.getElementById('summary').innerHTML='<div class="sitem">Filled: <strong>'+filled+'/'+myRoasters.length+'</strong></div><div class="sitem">Avg coverage: <strong>'+avg+(avg!=='—'?' /12':'')+'</strong></div>';
}
</script>
</body>
</html>
